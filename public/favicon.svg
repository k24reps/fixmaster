<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- Favicon = the "Volt" mascot badge (same art as logo.svg). -->
  <defs>
    <linearGradient id="g-brand" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#3dd9c4"/>
    </linearGradient>
    <filter id="f-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="g-sheen" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="11" fill="url(#g-brand)"/>
  <rect width="48" height="48" rx="11" fill="url(#g-sheen)"/>
  <rect x="22.8" y="8" width="2.4" height="6.5" rx="1.2" fill="#0b0d11" opacity="0.6"/>
  <circle cx="24" cy="6.5" r="2.8" fill="#3dd9c4" filter="url(#f-glow)"/>
  <g opacity="0.5">
    <circle cx="8" cy="10.5" r="1.8" fill="#0b0d11"/>
    <line x1="6.9" y1="9.4" x2="9.1" y2="11.6" stroke="#f5a623" stroke-width="0.7"/>
    <circle cx="40" cy="10.5" r="1.8" fill="#0b0d11"/>
    <line x1="38.9" y1="9.4" x2="41.1" y2="11.6" stroke="#f5a623" stroke-width="0.7"/>
  </g>
  <rect x="9" y="16.5" width="30" height="21" rx="6.5" fill="#0b0d11" opacity="0.92"/>
  <circle cx="18.5" cy="25.5" r="3.1" fill="#3dd9c4" filter="url(#f-glow)"/>
  <circle cx="29.5" cy="25.5" r="3.1" fill="#3dd9c4" filter="url(#f-glow)"/>
  <path d="M18.5 31 Q24 35.4 29.5 31" stroke="#f5a623" stroke-width="2.2" stroke-linecap="round"/>
  <g stroke="#0b0d11" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
    <line x1="19" y1="40.5" x2="19" y2="43"/>
    <line x1="24" y1="40.5" x2="24" y2="43"/>
    <line x1="29" y1="40.5" x2="29" y2="43"/>
  </g>
</svg>
