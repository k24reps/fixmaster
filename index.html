        <h1>FixMaster: Toko Servis yang Rapi dan Teratur, Mulai Hari Ini</h1>
        <p>
          FixMaster adalah aplikasi untuk toko reparasi elektronik apa saja: HP, laptop, printer,
          TV, sampai alat rumah tangga. Dari unit masuk sampai pembayaran, satu tiket menghubungkan
          sparepart, stok, biaya, pelanggan, kas, dan laporan tanpa pencatatan ulang.
        </p>
        <h2>Fitur utama</h2>
        <ul>
          <li>Tiket servis digital: lacak tiap perbaikan dari masuk sampai diambil.</li>
          <li>Kasir (POS): jual sparepart &amp; jasa, cetak struk.</li>
          <li>Inventori sparepart dengan peringatan stok menipis.</li>
          <li>Keuangan multi-akun kas/bank &amp; margin per servis.</li>
          <li>Tautan lacak publik agar pelanggan cek status sendiri.</li>
          <li>Laporan, absensi, multi-peran, dan jejak audit.</li>
        </ul>
        <p>
          Mulai dengan 50 unit gratis tanpa kartu kredit. Aktifkan JavaScript untuk menjalankan aplikasi.
        </p>
        <h2>Harga</h2>
        <ul>
          <li>Rp 1.000 per unit masuk (satu tiket servis), dibayar dari saldo yang diisi di muka. Paling banyak Rp 100.000 per cabang sebulan.</li>
          <li>50 unit pertama gratis. Semua fitur, pengguna dan outlet tidak dibatasi.</li>
        </ul>
        <h2>Pertanyaan umum</h2>
        <h3>Apakah FixMaster hanya untuk servis HP?</h3>
        <p>Tidak. FixMaster dipakai untuk HP, laptop, tablet, printer, TV, audio, konsol, dan elektronik rumah tangga. Kategori perangkat, keluhan cepat, dan daftar kelengkapan Anda atur sendiri, jadi toko servis printer tidak perlu memakai daftar milik konter HP.</p>
        <h3>Bagaimana jika data masih di Excel?</h3>
        <p>Anda tidak perlu memindahkan semua riwayat lama sekaligus. Cukup mulai catat unit yang baru masuk di FixMaster hari ini; file Excel lama tetap bisa dibuka sebagai arsip. Belum ada impor otomatis, tetapi tim FixMaster bisa membantu memindahkan data pelanggan atau stok inti lewat WhatsApp.</p>
