        <h1>FixMaster — Catat Servis Sekali, Stok dan Margin Ikut Terhitung</h1>
        <p>
          FixMaster adalah aplikasi untuk konter HP, jasa servis laptop, dan reparasi elektronik.
          Dari unit masuk sampai pembayaran, satu tiket menghubungkan sparepart, stok, biaya,
          pelanggan, kas, dan laporan tanpa pencatatan ulang.
        </p>
        <h2>Fitur utama</h2>
        <ul>
          <li>Tiket servis digital — lacak tiap perbaikan dari masuk sampai diambil.</li>
          <li>Kasir (POS) — jual sparepart &amp; jasa, cetak struk.</li>
          <li>Inventori sparepart dengan peringatan stok menipis.</li>
          <li>Keuangan multi-akun kas/bank &amp; margin per servis.</li>
          <li>Tautan lacak publik agar pelanggan cek status sendiri.</li>
          <li>Laporan, absensi, multi-peran, dan jejak audit.</li>
        </ul>
        <p>
          Coba gratis 14 hari tanpa kartu kredit. Aktifkan JavaScript untuk menjalankan aplikasi.
        </p>
        <h2>Harga</h2>
        <ul>
          <li>Solo — Rp 99.000 per bulan untuk 1 pengguna dan 1 outlet.</li>
          <li>Pro — Rp 199.000 per bulan untuk pengguna tak terbatas dan 2 outlet.</li>
        </ul>
        <h2>Pertanyaan umum</h2>
        <h3>Apakah FixMaster hanya untuk servis HP?</h3>
        <p>Tidak. FixMaster juga mendukung laptop, tablet, printer, konsol, dan elektronik konsumen lainnya.</p>
        <h3>Bagaimana jika data masih di Excel?</h3>
        <p>Anda tidak perlu memindahkan semua riwayat lama sekaligus. Cukup mulai catat unit yang baru masuk di FixMaster hari ini; file Excel lama tetap bisa dibuka sebagai arsip. Belum ada impor otomatis, tetapi tim FixMaster bisa membantu memindahkan data pelanggan atau stok inti lewat WhatsApp.</p>
