project_id = "fixmaster"

# Edge Functions config. Declaring verify_jwt here (instead of relying on the
# --no-verify-jwt CLI flag) keeps the setting version-controlled and prevents
# accidental redeploys from re-enabling JWT on the public webhook.

[functions.create-invoice]
# The platform JWT gate can reject new-format session tokens, which would
# make the function unreachable (client sees 401 → silent mock fallback).
# So we disable the gate and verify the caller INSIDE the function via
# getUser() (it rejects missing/invalid tokens), keeping auth intact.
verify_jwt = false

[functions.duitku-webhook]
# Called by Duitku's servers (no Supabase session) → must be public.
# Authenticity is enforced inside the function via an MD5 signature check
# (md5(merchantCode + amount + merchantOrderId + DUITKU_API_KEY)).
verify_jwt = false

[functions.fersaku-webhook]
# DEPRECATED — replaced by Duitku (duitku-webhook). Kept public for any
# in-flight Fersaku callbacks during cutover; safe to remove once no pending
# Fersaku invoices remain.
verify_jwt = false

[functions.health]
# Public liveness/readiness probe for external uptime monitors. Returns only
# a status summary (no tenant data), so no auth is needed.
verify_jwt = false

[functions.delete-account]
# Deletes the caller's OWN auth credential. We verify the caller's JWT inside
# the function (getUser) and only ever delete that id, so the platform gate is
# disabled to keep the function reachable for all valid session tokens.
verify_jwt = false
